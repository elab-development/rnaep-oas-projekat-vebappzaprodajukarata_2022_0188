apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
        - name: ticket-service
          image: milicaadrljacaa/ticket-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "mysql+pymysql://root:rootpass@mysql-ticket.databases.svc.cluster.local:3306/ticket_db"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: app
spec:
  selector:
    app: ticket-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
