apiVersion: apps/v1
kind: Deployment
metadata:
  name: ticket-service
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ticket-service
  template:
    metadata:
      labels:
        app: ticket-service
    spec:
      containers:
        - name: ticket-service
          image: milicaadrljacaa/ticket-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: DB_USER
              value: "root"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: db-password
            - name: DB_HOST
              value: "mysql-ticket.databases.svc.cluster.local"
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: "ticket_db"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka-cluster-kafka-bootstrap.kafka.svc.cluster.local:9092"
---
apiVersion: v1
kind: Service
metadata:
  name: ticket-service
  namespace: app
spec:
  selector:
    app: ticket-service
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
