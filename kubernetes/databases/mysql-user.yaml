apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-user-pvc
  namespace: databases
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-user
  namespace: databases
spec:
  serviceName: mysql-user
  replicas: 1
  selector:
    matchLabels:
      app: mysql-user
  template:
    metadata:
      labels:
        app: mysql-user
    spec:
      containers:
        - name: mysql-user
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: root-password
            - name: MYSQL_DATABASE
              value: users_db
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: mysql-user-storage
              mountPath: /var/lib/mysql
      volumes:
        - name: mysql-user-storage
          persistentVolumeClaim:
            claimName: mysql-user-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: mysql-user
  namespace: databases
spec:
  selector:
    app: mysql-user
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP
